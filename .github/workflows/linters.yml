name: Linters

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  backend-linter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Go to backend directory
      run: cd ./app/backend

    - name: Install dependencies
      run: npm install

    - name: Run linter
      run: npm run linter

  frontend-linter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Go to frontend directory
      run: cd ./app/frontend

    - name: Install dependencies
      run: npm install

    - name: Run linter
      run: npm run linter