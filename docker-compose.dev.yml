services:
  proxy:
    image: eatingreen-nginx
    container_name: eatingreen-nginx
    build: ./app/proxy
    ports:
      - '$SERVER_PORT:80'
    environment:
      - SERVER_NAME=localhost
      - SERVER_PORT=80
      - BACKEND_PATH=backend
      - FRONTEND_HOST=frontend
      - FRONTEND_PORT=5173
      - BACKEND_HOST=backend
      - BACKEND_PORT=3000
    depends_on:
      - frontend
      - backend
    networks:
      - eatingreen-network

  frontend:
    image: eatingreen-react
    container_name: eatingreen-react
    build:
      context: ./app/frontend
      dockerfile: dockerfile.dev
    expose:
      - 5173
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    networks:
      - eatingreen-network

  backend:
    image: eatingreen-express
    container_name: eatingreen-express
    build:
      context: ./app/backend
      dockerfile: dockerfile.dev
    expose:
      - 3000
    volumes:
      - ./app/backend:/app
      - /app/node_modules
    environment:
      - SERVER_PORT=3000
      - NODE_ENV=development
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
      - DB_HOST=db
      - DB_PORT=$DB_PORT
      - DB_NAME=eatingreen
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - eatingreen-network

  db:
    image: 'mongo'
    container_name: eatingreen-mongo
    ports:
      - '$DB_PORT:27017'
    volumes:
      - db:/data/db
    environment:
      MONGO_INITDB_DATABASE: eatingreen
      MONGO_INITDB_ROOT_USERNAME: $DB_USER
      MONGO_INITDB_ROOT_PASSWORD: $DB_PASSWORD
    networks:
      - eatingreen-network

volumes:
  db:

networks:
  eatingreen-network: